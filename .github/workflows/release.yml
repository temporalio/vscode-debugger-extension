name: Release to VS Code Extension Marketplace

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.head_ref, 'releases/') && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Clean install
        run: npm ci
      - name: Build package
        run: npm run build
      - name: Test
        run: npm test
      - name: Publish package to marketplace
        run: npm run publish
        env:
          VSCE_PAT: ${{secrets.VSCODE_MARKETPLACE_PERSONAL_ACCESS_TOKEN}}
  create_release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      - name: Create Release
        run: |
          version=`cat ./package.json | jq -r .version`
          echo "latest version: $version"
          tag="v$version"
          echo "creating release: $tag"
          gh release create $tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.COMMANDER_DATA_TOKEN }}
